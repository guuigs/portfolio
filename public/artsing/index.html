<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtSing</title>
    <script src="libraries/p5.min.js"></script>
    <link rel="icon" href="imgs/icon2.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="artsing-responsive.css">
</head>
<body>


    <header>
        <div class="header-text">ArtSing</div>
        <div class="header-image" id="header-image">
            <a href="/cas-etudes?projet=artsing">
                <img src="imgs/icon.png" alt="Header Image">
            </a>
            <div class="tooltip" id="tooltip">ouvrir le portfolio du créateur</div>
        </div>
    </header>
    <div class="title">
        <p id="titre">The <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 5vw; font-weight:lighter;">art</span> of</p>
        <p id="titre2">singing together</p>
    </div>
    <div class="columns">
        <div class="card" id="card">
            <a href="vangogh.html">
                <p id="celebrity">Van Gogh</p>
                <img src="imgs/vangogh.png" alt="Image 1">
                <p id="music-name">Tainted Love</p>
            </a>
        </div>


        <div class="card" id="card">
            <a href="chopin.html">
                <p id="celebrity">Chopin</p>
                <img src="imgs/chopin.png" alt="Image 2">
                <p id="music-name">Un peu de haine</p>
            </a>
        </div>


        <div class="card" id="card">
            <a href="monalisa.html">
                <p id="celebrity">Mona Lisa</p>
                <img src="imgs/monalisa.png" alt="Image 3">
                <p id="music-name">Sunny</p>
            </a>
        </div>
    </div>

<script src="Javascript.js"></script>
</body>
</html>
