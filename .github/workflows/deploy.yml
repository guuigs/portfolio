name: Deploy to OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 minimum : @tailwindcss/oxide, la partie native de Tailwind v4,
      # ne publie pas de binaire pour Node 18. Sur 18, npm passe l'installation
      # du binding en EBADENGINE puis le build meurt sur « Cannot find native
      # binding » — ce qui ressemble à un bug npm mais n'est que la version.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ci plutôt qu'install : respecte le lock à la lettre, et évite justement
      # la résolution partielle des dépendances optionnelles.
      - name: Install dependencies
        run: npm ci

      # Vite inlines VITE_* at build time, so these have to exist here — not
      # on the server. Absent, the site still builds and runs; the CMS simply
      # stays local instead of publishing.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/   # React = dossier build/
          server-dir: /www/
